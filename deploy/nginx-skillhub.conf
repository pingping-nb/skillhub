# Reverse proxy for exposing the SkillHub dev stack on a public hostname.
#
# The domain owner routes skillhub.bards.neobards.com to this host. This proxy
# accepts that hostname on SKILLHUB_PROXY_PORT (default 80) and forwards to the
# Vite dev server on 127.0.0.1:3000.
#
# TLS is terminated upstream by the domain owner, so this listener is plain HTTP.
# If TLS is later terminated here instead, add a `listen 443 ssl;` server block
# with the certificate and keep the same location blocks.
#
# Run with:
#   docker run -d --name skillhub-proxy --restart unless-stopped \
#     --network host \
#     -v /home/ping/skillhub/deploy/nginx-skillhub.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:alpine

server {
    listen 80;
    server_name skillhub.bards.neobards.com 192.168.22.22 localhost;

    client_max_body_size 100M;

    # IMPORTANT: do NOT forward X-Forwarded-Proto: https here.
    #
    # The backend runs with `server.forward-headers-strategy: framework`, so
    # X-Forwarded-Proto directly controls request.isSecure(). If we claim https
    # while the browser actually reaches us over plain HTTP, Spring marks the
    # session cookie `Secure`; the browser then refuses to store/send it, the
    # session is lost, and every authenticated endpoint returns 403.
    #
    # Only re-enable the block below once TLS terminates on THIS host (or the
    # upstream proxy is guaranteed to talk https to us end-to-end).
    #
    # set $forwarded_proto $http_x_forwarded_proto;
    # if ($forwarded_proto = "") {
    #     set $forwarded_proto $scheme;
    # }
    set $forwarded_proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Vite's HMR websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 900s;
        proxy_buffering off;
    }
}
